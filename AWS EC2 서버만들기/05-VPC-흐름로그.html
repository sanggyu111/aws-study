<script>
const DATA = JSON.parse(document.getElementById("doc-data").textContent);
const $page = document.getElementById("page");
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

/* minimal markdown: escaped text, **bold**, `code`, https links, - lists, paragraphs */
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function inline(s) {
  return String(s).split(/(`[^`]+`)/g).map((p) => /^`[^`]+`$/.test(p) ? "<code>" + esc(p.slice(1, -1)) + "</code>" :
    esc(p).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')).join("");
}
function md(src) {
  const out = []; let para = [], list = [];
  const flush = () => {
    if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; }
    if (list.length) { out.push("<ul>" + list.map((i) => "<li>" + inline(i) + "</li>").join("") + "</ul>"); list = []; }
  };
  for (const line of String(src).split("\n")) {
    const m = line.match(/^\s*[-*]\s+(.*)/);
    if (m) { if (para.length) { out.push("<p>" + para.map(inline).join("<br>") + "</p>"); para = []; } list.push(m[1]); }
    else if (!line.trim()) flush();
    else { if (list.length) flush(); para.push(line); }
  }
  flush();
  return out.join("");
}

function blockShell(b, extraClass) {
  const box = el("div", "block" + (extraClass ? " " + extraClass : ""));
  if (b.title || b.derived) {
    const t = el("p", "block-title", b.title || "");
    if (b.derived) t.append(el("span", "derived", "원문을 바탕으로 정리"));
    box.append(t);
  }
  return box;
}

function renderStats(items) {
  const g = el("div", "stats");
  for (const s of items || []) {
    const c = el("div", "stat");
    c.append(el("span", "v", s.value), el("span", "l", s.label));
    if (s.note) c.append(el("span", "n", s.note));
    g.append(c);
  }
  return g;
}

function renderCards(b) {
  const box = blockShell(b);
  const g = el("div", "cards");
  for (const c of b.items || []) {
    const card = el("div", "card");
    if (c.tag) card.append(el("span", "tag", c.tag));
    card.append(el("b", null, c.title));
    if (c.text) card.append(el("span", "t", c.text));
    g.append(card);
  }
  box.append(g);
  return box;
}

function cell(tag, v, hl) {
  const c = el(tag, hl ? "hl" : null);
  const s = String(v ?? "");
  if (/^(✓|O|o|예|가능)$/.test(s)) c.append(el("span", "yes", "✓"));
  else if (/^(✗|X|x|아니오|불가)$/.test(s)) c.append(el("span", "no", "✗"));
  else c.textContent = s;
  return c;
}
function renderCompare(b) {
  const box = blockShell(b);
  const wrap = el("div", "tbl");
  const t = el("table");
  const hl = Number.isInteger(b.highlight) ? b.highlight : -1;
  const thead = el("thead"), tr = el("tr");
  (b.columns || []).forEach((c, i) => { const th = el("th", i === hl ? "hl" : null, c); th.scope = "col"; tr.append(th); });
  thead.append(tr);
  const tbody = el("tbody");
  for (const row of b.rows || []) {
    const r = el("tr");
    row.forEach((v, i) => { const c = cell(i === 0 ? "th" : "td", v, i === hl); if (i === 0) { c.scope = "row"; c.textContent = String(v); } r.append(c); });
    tbody.append(r);
  }
  t.append(thead, tbody);
  wrap.append(t);
  box.append(wrap);
  return box;
}

function renderCallout(b) {
  const c = el("div", "callout" + (b.tone === "warn" ? " warn" : ""));
  c.append(el("p", "label", b.title || (b.tone === "warn" ? "주의" : "참고")));
  const body = el("div", "md");
  body.innerHTML = md(b.text || "");
  c.append(body);
  return c;
}

function renderTimeline(b) {
  const box = blockShell(b);
  const ol = el("ol", "timeline");
  for (const it of b.items || []) {
    const li = el("li", "tl");
    li.dataset.status = ["done", "now", "next"].includes(it.status) ? it.status : "next";
    li.append(el("span", "dot"));
    if (it.when) li.append(el("span", "when", it.when));
    li.append(el("b", null, it.title));
    if (it.text) li.append(el("span", "t", it.text));
    ol.append(li);
  }
  box.append(ol);
  return box;
}

function renderText(b) {
  const box = blockShell(b, b.title || b.derived ? "" : "text-block");
  const d = el("div", "md");
  d.innerHTML = md(b.md || "");
  box.append(d);
  return box;
}

/* flow: longest-path ranks left → right, SVG wires, step-through highlighting */
const KIND = { input: "입력", process: "처리", store: "저장", output: "결과", concept: "개념", decision: "판단" };
let flowSeq = 0;
function renderFlow(b) {
  const box = blockShell(b);
  const uid = "f" + ++flowSeq;
  const nodes = (b.nodes || []).filter((n) => n && n.id && n.label);
  const ids = new Set(nodes.map((n) => n.id));
  const edges = (b.edges || []).filter((e) => ids.has(e.from) && ids.has(e.to) && e.from !== e.to);
  const steps = (b.steps || []).filter((s) => s && s.text).map((s) => ({ focus: (s.focus || []).filter((x) => ids.has(x)), text: s.text }));

  const rank = Object.fromEntries(nodes.map((n) => [n.id, 0]));
  for (let k = 0; k < nodes.length; k++) {
    let changed = false;
    for (const e of edges) if (rank[e.from] + 1 > rank[e.to] && rank[e.from] + 1 < nodes.length) { rank[e.to] = rank[e.from] + 1; changed = true; }
    if (!changed) break;
  }
  const firstStep = {};
  steps.forEach((s, i) => s.focus.forEach((id) => { if (!(id in firstStep)) firstStep[id] = i; }));

  const scroll = el("div", "flow-scroll");
  const flow = el("div", "flow");
  flow.dataset.dir = "row";
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.classList.add("wires");
  svg.setAttribute("aria-hidden", "true");
  flow.append(svg);

  const nodeEls = {};
  const maxRank = Math.max(0, ...Object.values(rank));
  for (let r = 0; r <= maxRank; r++) {
    const col = el("div", "rank");
    for (const n of nodes.filter((n) => rank[n.id] === r)) {
      const ne = el("div", "node");
      ne.dataset.kind = KIND[n.kind] ? n.kind : "concept";
      ne.append(el("span", "kind", KIND[ne.dataset.kind]), el("b", null, n.label));
      if (n.note) ne.append(el("small", null, n.note));
      if (n.id in firstStep) ne.append(el("span", "badge", String(firstStep[n.id] + 1)));
      nodeEls[n.id] = ne;
      col.append(ne);
    }
    if (col.childElementCount) flow.append(col);
  }
  scroll.append(flow);
  box.append(scroll);

  let wireEls = [], current = -1;
  const draw = () => {
    const bx = flow.getBoundingClientRect();
    if (!bx.width) return;
    const row = flow.dataset.dir === "row";
    svg.setAttribute("viewBox", `0 0 ${bx.width} ${bx.height}`);
    svg.setAttribute("width", bx.width);
    svg.setAttribute("height", bx.height);
    svg.replaceChildren();
    const defs = document.createElementNS(NS, "defs");
    for (const k of ["off", "on"]) {
      const mk = document.createElementNS(NS, "marker");
      mk.setAttribute("id", `${uid}-${k}`);
      mk.setAttribute("viewBox", "0 0 10 10");
      mk.setAttribute("refX", "9"); mk.setAttribute("refY", "5");
      mk.setAttribute("markerWidth", "7"); mk.setAttribute("markerHeight", "7");
      mk.setAttribute("markerUnits", "userSpaceOnUse");
      mk.setAttribute("orient", "auto");
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", "M0,0 L10,5 L0,10 z");
      p.setAttribute("class", "arrow-head" + (k === "on" ? " on" : ""));
      mk.append(p);
      defs.append(mk);
    }
    svg.append(defs);
    wireEls = edges.map((e) => {
      const a = nodeEls[e.from].getBoundingClientRect(), c = nodeEls[e.to].getBoundingClientRect();
      let x1, y1, x2, y2, d;
      if (row) {
        x1 = a.right - bx.left; y1 = a.top + a.height / 2 - bx.top;
        x2 = c.left - bx.left - 2; y2 = c.top + c.height / 2 - bx.top;
        const dx = Math.max(28, Math.abs(x2 - x1) / 2);
        d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
      } else {
        x1 = a.left + a.width / 2 - bx.left; y1 = a.bottom - bx.top;
        x2 = c.left + c.width / 2 - bx.left; y2 = c.top - bx.top - 2;
        const dy = Math.max(22, Math.abs(y2 - y1) / 2);
        d = `M${x1},${y1} C${x1},${y1 + dy} ${x2},${y2 - dy} ${x2},${y2}`;
      }
      const path = document.createElementNS(NS, "path");
      path.setAttribute("d", d);
      path.setAttribute("class", "wire");
      svg.append(path);
      let text = null;
      if (e.label) {
        text = document.createElementNS(NS, "text");
        text.setAttribute("class", "wire-label");
        text.setAttribute("x", (x1 + x2) / 2 + (row ? 0 : 8));
        text.setAttribute("y", (y1 + y2) / 2 + (row ? -7 : 4));
        text.setAttribute("text-anchor", row ? "middle" : "start");
        text.textContent = e.label;
        svg.append(text);
      }
      return { e, path, text };
    });
    apply(current);
  };

  const stepper = el("div", "stepper");
  const prev = el("button", null, "이전"); prev.type = "button";
  const next = el("button"); next.type = "button";
  const stepText = el("div", "step-text"); stepText.setAttribute("aria-live", "polite");
  stepper.append(prev, stepText, next);
  if (steps.length) box.append(stepper);

  const paint = (onNodes, onEdge) => {
    for (const n of nodes) {
      const on = onNodes ? onNodes.has(n.id) : false;
      nodeEls[n.id].classList.toggle("on", on);
      nodeEls[n.id].classList.toggle("dim", !!onNodes && !on);
    }
    for (const w of wireEls) {
      const on = onNodes ? onEdge(w.e) : false, dim = !!onNodes && !on;
      w.path.classList.toggle("on", on); w.path.classList.toggle("dim", dim);
      w.path.setAttribute("marker-end", `url(#${uid}-${on ? "on" : "off"})`);
      if (w.text) { w.text.classList.toggle("on", on); w.text.classList.toggle("dim", dim); }
    }
  };
  function apply(i) {
    current = i;
    stepText.replaceChildren();
    if (i < 0) {
      paint(null);
      stepText.append(el("span", "num", "전체"), "'따라가기'를 누르면 흐름을 한 단계씩 짚어 드려요.");
    } else {
      const focus = new Set(steps[i].focus), before = new Set(i > 0 ? steps[i - 1].focus : []);
      paint(focus, (e) => (focus.has(e.from) && focus.has(e.to)) || (before.has(e.from) && focus.has(e.to)));
      stepText.append(el("span", "num", `${i + 1} / ${steps.length}`), steps[i].text);
    }
    prev.disabled = i < 0;
    next.disabled = i >= steps.length - 1;
    next.textContent = i < 0 ? "따라가기" : "다음";
  }
  prev.onclick = () => apply(current - 1);
  next.onclick = () => apply(current + 1);

  new ResizeObserver(() => {
    const dir = scroll.clientWidth < 520 ? "col" : "row";
    if (flow.dataset.dir !== dir) flow.dataset.dir = dir;
    requestAnimationFrame(draw);
  }).observe(scroll);
  apply(-1);
  return box;
}

const RENDER = { flow: renderFlow, timeline: renderTimeline, compare: renderCompare, cards: renderCards, callout: renderCallout, text: renderText,
  stats: (b) => { const box = blockShell(b); box.append(renderStats(b.items)); return box; } };

/* page */
const head = el("header", "doc-head");
head.append(el("span", "eyebrow", "문서 정리"), el("h1", null, DATA.title));
if (DATA.subtitle) head.append(el("p", "subtitle", DATA.subtitle));
if (DATA.source) {
  const s = el("div", "source");
  const name = el("span", null, "원문: ");
  if (DATA.source.url && /^https:\/\//.test(DATA.source.url)) {
    const a = el("a", null, DATA.source.name || DATA.source.url);
    a.href = DATA.source.url; a.target = "_blank"; a.rel = "noopener";
    name.append(a);
  } else name.append(DATA.source.name || "");
  s.append(name);
  if (DATA.source.date) s.append(el("span", null, "정리한 날: " + DATA.source.date));
  head.append(s);
}
$page.append(head);

if (DATA.tldr || (DATA.keypoints || []).length || (DATA.stats || []).length) {
  const g = el("section", "glance");
  const t = el("div", "tldr");
  t.append(el("p", "label", "한 줄 요약"));
  if (DATA.tldr) t.append(el("p", "lead", DATA.tldr));
  if ((DATA.keypoints || []).length) {
    const ul = el("ul");
    for (const k of DATA.keypoints) { const li = el("li"); li.innerHTML = inline(k); ul.append(li); }
    t.append(ul);
  }
  g.append(t);
  if ((DATA.stats || []).length) {
    const w = el("div", "stats-wrap");
    w.append(el("p", "label", "핵심 수치"), renderStats(DATA.stats));
    g.append(w);
  } else g.style.gridTemplateColumns = "1fr";
  $page.append(g);
}

const secs = DATA.sections || [];
if (secs.length > 1) {
  const nav = el("nav", "toc");
  nav.setAttribute("aria-label", "목차");
  secs.forEach((s, i) => { const a = el("a", null, s.heading); a.href = "#" + (s.id || "s" + (i + 1)); nav.append(a); });
  $page.append(nav);
}

secs.forEach((s, i) => {
  const sec = el("section", "sec");
  sec.id = s.id || "s" + (i + 1);
  const h = el("div", "sec-head");
  h.append(el("span", "sec-num", String(i + 1).padStart(2, "0")), el("h2", null, s.heading));
  if (s.lead) h.append(el("p", "sec-lead", s.lead));
  sec.append(h);
  for (const b of s.blocks || []) {
    const fn = RENDER[b.type];
    if (fn) sec.append(fn(b));
  }
  $page.append(sec);
});

const foot = el("footer", "foot");
foot.append(el("span", null, "원문을 바탕으로 정리한 페이지예요. 수치와 조건은 원문 표현을 따랐고, '원문을 바탕으로 정리' 표시가 있는 그림은 원문 내용을 재구성한 거예요."));
if (DATA.source && DATA.source.url) foot.append(el("span", null, "정확한 최신 내용은 원문에서 확인하세요."));
$page.append(foot);
</script>
